      - name: Extract project ZIP
        run: |
          ls -la
          ZIP=$(find . -maxdepth 3 -iname "Master_Metals_Pixel_APK_Build_Package.zip" | head -n 1)
          test -n "$ZIP" || { echo "ZIP NOT FOUND in repo"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          PKG=$(find source -name package.json -not -path "*/node_modules/*" | head -n 1)
          test -n "$PKG" || { echo "package.json NOT FOUND"; find source | head -50; exit 1; }
          DIR=$(dirname "$PKG")
          if [ "$DIR" != "source/mastermetals_work" ]; then
            rm -rf /tmp/proj && mkdir -p /tmp/proj
            cp -a "$DIR"/. /tmp/proj/
            rm -rf source/mastermetals_work
            mkdir -p source/mastermetals_work
            cp -a /tmp/proj/. source/mastermetals_work/
          fi
          test -f source/mastermetals_work/capacitor.config.ts || test -f source/mastermetals_work/capacitor.config.json
          ls source/mastermetals_work
